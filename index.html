<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABHI Web Page</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Font_Awesome_5_brands_Facebook_f.svg/512px-Font_Awesome_5_brands_Facebook_f.svg.png" type="image/png"> <!-- Website icon -->
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #e3f2fd;  /* Light blue background */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      position: relative;
      flex-direction: column;
    }

    h1 {
      color: #3f51b5;
      font-size: 48px;
      text-align: center;
      margin-bottom: 20px;
    }

    button {
      padding: 15px 30px;
      background-color: #3f51b5;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #303f9f;
    }

    /* Footer social media section */
    .footer {
      position: absolute;
      left: 20px;
      bottom: 20px;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .social-icon {
      width: 30px;
      height: 30px;
      margin-right: 10px;
    }

    .social-link {
      display: flex;
      align-items: center;
      color: #333;
      text-decoration: none;
    }

    .social-link:hover {
      color: #3f51b5;
    }

  </style>
</head>
<body>
  <div>
    <h1>ABHI Web Page</h1>
    <button onclick="window.location.href='editor.html'">Go to Page</button>
  </div>

  <!-- Footer section with social media -->
  <div class="footer">
    <!-- Facebook Logo and Name -->
    <a href="https://www.facebook.com/AbinashGhimire" target="_blank" class="social-link">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook" class="social-icon">
      - Abinash Ghimire
    </a>

    <!-- Instagram Logo and Username -->
    <a href="https://www.instagram.com/abhinash.ghimire.568" target="_blank" class="social-link">
      <img src="https://upload.wikimedia.org/wikipedia/commons/9/95/Instagram_logo_2022.svg" alt="Instagram" class="social-icon">
      - abhinash.ghimire.568
    </a>
  </div>
</body>
</html>
