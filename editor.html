<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABHI Docs Editor</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Font_Awesome_5_brands_Facebook_f.svg/512px-Font_Awesome_5_brands_Facebook_f.svg.png" type="image/png"> <!-- Website icon -->
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #fafafa;
      margin: 0;
      padding: 0;
    }
    .toolbar {
      background-color: #3f51b5;
      color: white;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .toolbar button {
      background: none;
      border: none;
      color: white;
      font-size: 16px;
      margin: 0 5px;
      cursor: pointer;
    }
    .editor {
      width: 100%;
      height: 80vh;
      padding: 20px;
      background-color: white;
      border: 1px solid #ccc;
      overflow-y: auto;
    }
    .footer {
      position: absolute;
      bottom: 10px;
      left: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- Toolbar with editing options -->
  <div class="toolbar">
    <div>
      <button onclick="execCmd('bold')">B</button>
      <button onclick="execCmd('italic')">I</button>
      <button onclick="execCmd('underline')">U</button>
      <button onclick="execCmd('strikeThrough')">S</button>
      <button onclick="execCmd('justifyLeft')">Left</button>
      <button onclick="execCmd('justifyCenter')">Center</button>
      <button onclick="execCmd('justifyRight')">Right</button>
      <button onclick="execCmd('insertUnorderedList')">• List</button>
      <button onclick="execCmd('insertOrderedList')">1. List</button>
      <button onclick="changeFontSize()">Font Size</button>
      <button onclick="changeFontFamily()">Font</button>
      <button onclick="execCmd('foreColor', prompt('Enter color:'))">Text Color</button>
      <button onclick="execCmd('backColor', prompt('Enter background color:'))">BG Color</button>
      <button onclick="insertImage()">Insert Image</button>
      <button onclick="window.print()">Print</button>
    </div>
    <div>
      <input type="text" id="title" placeholder="Enter document title">
      <button onclick="saveDoc()">Save</button>
      <button onclick="loadDoc()">Load</button>
    </div>
  </div>

  <!-- Document editor -->
  <div class="editor" contenteditable="true" id="editor"></div>

  <!-- Footer with social media -->
  <div class="footer">
    <a href="https://www.facebook.com/AbinashGhimire" target="_blank">Facebook - Abinash Ghimire</a><br>
    <a href="https://www.instagram.com/abhinash.ghimire.568" target="_blank">Instagram - abhinash.ghimire.568</a>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js"></script>
  
  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY", // Replace with your Firebase API key
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com", // Replace with your Firebase project ID
      projectId: "YOUR_PROJECT_ID", // Replace with your Firebase project ID
      storageBucket: "YOUR_PROJECT_ID.appspot.com", // Replace with your Firebase storage bucket
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID", // Replace with your Firebase messaging sender ID
      appId: "YOUR_APP_ID" // Replace with your Firebase app ID
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Function to execute text formatting commands
    function execCmd(command, value = null) {
      document.execCommand(command, false, value);
    }

    // Change font size
    function changeFontSize() {
      const size = prompt("Enter font size (e.g., 18px, 24px):");
      execCmd('fontSize', size);
    }

    // Change font family
    function changeFontFamily() {
      const font = prompt("Enter font family (e.g., Arial, 'Times New Roman'):");
      execCmd('fontName', font);
    }

    // Insert image
    function insertImage() {
      const url = prompt("Enter image URL:");
      if (url) {
        execCmd('insertImage', url);
      }
    }

    // Save document to Firebase
    async function saveDoc() {
      const title = document.getElementById('title').value || 'Untitled';
      const content = document.getElementById('editor').innerHTML;
      
      // Save the document in Firebase Firestore
      await db.collection("docs").doc(title).set({
        content: content,
        updated: new Date()
      });

      alert("Document saved!");
    }

    // Load document from Firebase
    async function loadDoc() {
      const title = prompt("Enter document title to load:");
      
      // Get the document from Firestore
      const doc = await db.collection("docs").doc(title).get();
      
      if (doc.exists) {
        document.getElementById('editor').innerHTML = doc.data().content;
        document.getElementById('title').value = title;
      } else {
        alert("Document not found.");
      }
    }
  </script>

</body>
</html>
